[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "they-know-your-passwords-mcp"
version = "0.1.0"
description = "Local MCP demo server for They know your passwords"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.2.0",
]

[project.scripts]
they-know-your-passwords-mcp = "typ_mcp.server:main"

[tool.setuptools.packages.find]
include = ["typ_mcp*"]
